name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r PYTHON_MESA/requirements.txt pytest
      - name: Run smoke tests
        run: pytest -q PYTHON_MESA/tests
